# The configuration of the Moka skeleton, with the login throttling of the bundle and the second factor rule.
security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: auto
            cost: 4
            time_cost: 3
            memory_cost: 10

    providers:
        moka:
            id: Moka\Cms\Security\UserProvider

    role_hierarchy:
        ROLE_REDACTOR:
            - ROLE_MOKA_ENTRY
            - ROLE_MOKA_MEDIA
        ROLE_ADMIN:
            - ROLE_MOKA_ENTRY
            - ROLE_MOKA_MEDIA
            - ROLE_MOKA_MENU
            - ROLE_MOKA_USER
            - ROLE_MOKA_VARIABLE

    firewalls:
        moka:
            pattern: ^/admin
            provider: moka
            lazy: true
            custom_authenticator:
                - Moka\Cms\Security\AdminAuthenticator
            logout:
                path: moka_admin_logout
                target: moka_admin_login
            login_throttling:
                limiter: iq2i_herse.login_throttling.limiter
        main:
            lazy: true

    access_control:
        - { path: ^/admin/login, roles: PUBLIC_ACCESS }
        - { path: ^/admin/reset-password, roles: PUBLIC_ACCESS }
        # Before the rule of the administration: only one rule applies to a path.
        - { path: ^/admin/2fa, roles: IS_AUTHENTICATED_2FA_IN_PROGRESS }
        - { path: ^/admin, roles: ROLE_MOKA }
