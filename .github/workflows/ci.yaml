name: "Continuous Integration"

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    security:
        name: "Security"
        uses: IQ2i/.github/.github/workflows/php-security.yml@main
        with:
            no-check-lock: true

    coding-standard:
        name: "Coding standard"
        uses: IQ2i/.github/.github/workflows/php-cs.yml@main

    static-analysis-highest:
        name: "Static analysis"
        uses: IQ2i/.github/.github/workflows/php-stan.yml@main
        with:
            php-version: "8.5"

    static-analysis-lowest:
        name: "Static analysis"
        uses: IQ2i/.github/.github/workflows/php-stan.yml@main
        with:
            php-version: "8.2"
            dependency-versions: lowest

    tests:
        name: "Tests"
        uses: IQ2i/.github/.github/workflows/bundle-ci.yml@main
        with:
            matrix: |
                [
                    {"php": "8.4", "symfony": "8.0", "name": "PHP 8.4, Symfony 8.0"},
                    {"php": "8.3", "symfony": "7.4", "name": "PHP 8.3, Symfony 7.4"},
                    {"php": "8.2", "symfony": "6.4", "dependency-versions": "lowest", "name": "PHP 8.2, Symfony 6.4, lowest deps"},
                    {"php": "8.5", "symfony": "8.0.x-dev", "stability": "dev", "name": "PHP 8.5, Symfony 8.0.x-dev"}
                ]

    tests-without-form:
        name: "Tests without symfony/form"
        runs-on: ubuntu-latest
        steps:
            - name: "Checkout repository"
              uses: actions/checkout@v7

            - name: "Setup PHP"
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.4"
                  coverage: none
                  tools: composer:v2

            # EasyAdmin requires symfony/form: it would bring it back.
            - name: "Remove symfony/form"
              run: composer remove --dev symfony/form easycorp/easyadmin-bundle --no-interaction --no-progress

            - name: "Run PHPUnit"
              run: vendor/bin/phpunit

    tests-without-scheb:
        name: "Tests without scheb/2fa-bundle"
        runs-on: ubuntu-latest
        steps:
            - name: "Checkout repository"
              uses: actions/checkout@v7

            - name: "Setup PHP"
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.4"
                  coverage: none
                  tools: composer:v2

            - name: "Remove scheb"
              run: composer remove --dev scheb/2fa-bundle scheb/2fa-email scheb/2fa-totp scheb/2fa-trusted-device --no-interaction --no-progress

            - name: "Run PHPUnit"
              run: vendor/bin/phpunit

    tests-sylius:
        name: "Tests on Sylius ${{ matrix.sylius }}"
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - sylius: "2.2"
                      php: "8.2"
                    - sylius: "2.3"
                      php: "8.4"
        steps:
            - name: "Checkout repository"
              uses: actions/checkout@v7

            - name: "Setup PHP"
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: exif, gd, intl, pdo_sqlite, sodium, zip
                  coverage: none
                  tools: composer:v2

            - name: "Install the Sylius application"
              working-directory: tests/SyliusApplication
              run: composer update --with "sylius/sylius:~${{ matrix.sylius }}.0" --no-interaction --no-progress

            - name: "Run PHPUnit"
              working-directory: tests/SyliusApplication
              run: php -d memory_limit=-1 vendor/bin/phpunit

    coverage:
        name: "Coverage"
        uses: IQ2i/.github/.github/workflows/php-tests.yml@main
        with:
            coverage: pcov
            coverage-floor: 95
